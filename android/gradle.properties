# Project-wide Gradle settings for CraftCaller.
org.gradle.jvmargs=-Xmx1800m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=true

# On-device (Termux/ARM) build support:
# use the native aapt2 binary; skip the x86 one from Maven repositories.
android.aapt2FromMavenOverride=/data/data/com.termux/files/usr/bin/aapt2
android.suppressUnsupportedCompileSdk=35

# Keep everything in one JVM (no Kotlin/Gradle daemons) to fit phone RAM.
kotlin.compiler.execution.strategy=in-process

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
